services:
  - type: web
    name: messenger-demo
    runtime: python
    plan: starter  # ← ОБЯЗАТЕЛЬНО starter или выше (для WebSocket)
    region: frankfurt  # или frankfurt (Европа)
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      gunicorn app:app --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: messenger-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: messenger-redis
          property: connectionString
      - key: SOCKETIO_MESSAGE_QUEUE
        fromService:
          type: redis
          name: messenger-redis
          property: connectionString
      - key: WEBSOCKET_ENABLED
        value: "true"
    healthCheckPath: /health
    autoDeploy: true

  - type: redis
    name: messenger-redis
    plan: starter  # Минимальный план для Redis
    maxmemoryPolicy: noeviction
    ipAllowList: []  # Доступ только изнутри Render

  - type: postgresql
    name: messenger-db
    plan: starter
    ipAllowList: []
    databaseName: messenger
    databaseUser: messenger