{% extends "base.html" %}

{% block title %}Создать группу - Messenger{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2 style="text-align: center; margin-bottom: 30px;">➕ Создать новую группу</h2>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="name">Название группы *</label>
                <input type="text" id="name" name="name" class="form-control" required maxlength="100" autofocus>
            </div>
            
            <div class="form-group">
                <label for="description">Описание (необязательно)</label>
                <textarea id="description" name="description" class="form-control" rows="3" maxlength="500"></textarea>
            </div>
            
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="is_private">
                    <span>🔒 Закрытая группа</span>
                </label>
                <small class="form-text text-muted">В закрытую группу можно попасть только по приглашению</small>
            </div>
            
            <div class="form-actions" style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">✨ Создать группу</button>
                <a href="{{ url_for('groups_list') }}" class="btn btn-secondary" style="flex: 1; text-align: center;">Отмена</a>
            </div>
        </form>
    </div>
</div>

<style>
.checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.form-text { display: block; margin-top: 5px; color: #666; font-size: 12px; }
</style>
{% endblock %}
