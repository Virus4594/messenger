{% extends "base.html" %}

{% block title %}Забыли пароль? - Messenger{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <h2 style="text-align: center; margin-bottom: 30px;">🔐 Забыли пароль?</h2>
        
        <p style="text-align: center; margin-bottom: 20px; color: var(--text-secondary);">
            Введите ваш email и мы отправим инструкции для сброса пароля
        </p>
        
        <form method="POST" action="{{ url_for('forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" class="form-control" required autofocus>
            </div>
            
            <button type="submit" class="btn" style="width: 100%;">
                📧 Отправить инструкции
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
            <p><a href="{{ url_for('login') }}">← Вернуться к входу</a></p>
        </div>
    </div>
</div>
{% endblock %}
