{% extends "base.html" %}

{% block title %}Сброс пароля - Messenger{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <h2 style="text-align: center; margin-bottom: 30px;">🔑 Сброс пароля</h2>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="password">Новый пароль:</label>
                <input type="password" id="password" name="password" class="form-control" required minlength="8">
                <small style="color: #666; font-size: 12px;">
                    Минимум 8 символов, включая заглавные и строчные буквы, цифры и специальные символы
                </small>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Подтвердите пароль:</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn" style="width: 100%;">
                💾 Сохранить новый пароль
            </button>
        </form>
    </div>
</div>

<script>
document.querySelector('form').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;
    
    if (password !== confirm) {
        e.preventDefault();
        alert('Пароли не совпадают!');
        return false;
    }
    
    const hasUpperCase = /[A-Z]/.test(password);
    const hasLowerCase = /[a-z]/.test(password);
    const hasNumbers = /\d/.test(password);
    const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
    
    if (!hasUpperCase || !hasLowerCase || !hasNumbers || !hasSpecial) {
        e.preventDefault();
        alert('Пароль должен содержать заглавные и строчные буквы, цифры и специальные символы!');
        return false;
    }
    
    return true;
});
</script>
{% endblock %}
